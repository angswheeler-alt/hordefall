<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1530" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Hordefall</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="stat"><span class="coin"></span><b id="gold">0</b></div>
        <div class="stat small"><span id="gps">0/s</span></div>
        <div class="stat small">Best <b id="best">1</b></div>
        <div class="stat small" id="embers-stat" hidden><span class="ember"></span><b id="embers">0</b></div>
      </header>
      <div id="game"></div>
      <div id="ults"></div>
      <div id="controls">
        <button id="speed" class="toggle">2x</button>
        <button id="autoult" class="toggle">Auto ult</button>
        <button id="boss" class="hot" hidden>Fight boss</button>
        <button id="rekindle" class="ember-btn" hidden>Rekindle</button>
        <span class="spacer"></span>
        <button id="mute" class="toggle" aria-label="Sound">Sound</button>
        <button id="buyamt">Buy x1</button>
      </div>
      <main id="heroes"></main>
      <footer id="debug">
        <span>Prototype</span>
        <button id="sim">Simulate 1h away</button>
        <button id="wipe">Reset save</button>
      </footer>
    </div>
    <div id="modal" hidden>
      <div class="card">
        <h2 id="modal-title">Welcome back!</h2>
        <p id="modal-body"></p>
        <div class="modal-actions">
          <button id="modal-cancel" hidden>Not yet</button>
          <button id="modal-ok" class="hot">Collect</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
